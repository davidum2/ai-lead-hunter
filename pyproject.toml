[project]
name = "ai-lead-hunter"
version = "0.1.0"
description = "Buscador automatizado de clientes y proyectos de Software e IA Aplicada"
readme = "README.md"
authors = [
    { name = "davidum2", email = "davidum215@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "patchright>=1.64.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
lead-hunter = "lead_hunter.cli:app"

[tool.uv.build-backend]
module-name = "lead_hunter"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
